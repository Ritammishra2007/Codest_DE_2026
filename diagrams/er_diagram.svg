<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1150" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- TITLE BLOCK -->
  <g transform="translate(825, 45)" text-anchor="middle">
    <text font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="0.5">YouTube Video Sharing Platform</text>
    <text y="26" font-size="14" font-weight="500" fill="#94a3b8">Relational Entity-Relationship Diagram (ERD) • PostgreSQL 3NF Schema</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTIONS ================= -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. users -> channels (1:N) [Sky Blue] -->
    <path d="M 340 180 L 460 180" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <rect x="375" y="166" width="50" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="400" y="180" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">1 : N</text>

    <!-- 2. channels -> videos (1:N) [Sky Blue] -->
    <path d="M 740 180 L 860 180" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <rect x="775" y="166" width="50" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="800" y="180" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">1 : N</text>

    <!-- 3. users -> subscriptions (1:N) [Emerald] -->
    <path d="M 180 340 L 180 430" stroke="#34d399" marker-end="url(#arrow-emerald)" />
    <rect x="155" y="370" width="50" height="20" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="180" y="384" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">1 : N</text>

    <!-- 4. channels -> subscriptions (1:N) [Emerald] -->
    <path d="M 500 340 L 500 480 L 320 480" stroke="#34d399" marker-end="url(#arrow-emerald)" />
    <rect x="395" y="469" width="50" height="20" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="420" y="483" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">1 : N</text>

    <!-- 5. users -> playlists (1:N) [Purple] -->
    <path d="M 260 340 L 260 400 L 1360 400 L 1360 180 L 1260 180" stroke="#c084fc" marker-end="url(#arrow-purple)" />
    <rect x="1335" y="270" width="50" height="20" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="1360" y="284" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">1 : N</text>

    <!-- 6. playlists -> playlist_items (1:N) [Purple] -->
    <path d="M 1120 270 L 1120 430" stroke="#c084fc" marker-end="url(#arrow-purple)" />
    <rect x="1095" y="340" width="50" height="20" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="1120" y="354" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">1 : N</text>

    <!-- 7. videos -> playlist_items (1:N) [Purple] -->
    <path d="M 1080 340 L 1080 390 L 1040 390 L 1040 430" stroke="#c084fc" marker-end="url(#arrow-purple)" />

    <!-- 8. users -> video_reactions (1:N) [Amber] -->
    <path d="M 220 340 L 220 590 L 460 590" stroke="#fbbf24" marker-end="url(#arrow-amber)" />
    <rect x="300" y="579" width="50" height="20" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="325" y="593" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">1 : N</text>

    <!-- 9. videos -> video_reactions (1:N) [Amber] -->
    <path d="M 900 370 L 900 590 L 720 590" stroke="#fbbf24" marker-end="url(#arrow-amber)" />
    <rect x="795" y="579" width="50" height="20" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="820" y="593" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">1 : N</text>

    <!-- 10. users -> comments (1:N) [Emerald] -->
    <path d="M 140 340 L 140 730 L 460 730" stroke="#34d399" marker-end="url(#arrow-emerald)" />
    <rect x="260" y="719" width="50" height="20" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="285" y="733" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">1 : N</text>

    <!-- 11. videos -> comments (1:N) [Emerald] -->
    <path d="M 940 370 L 940 730 L 720 730" stroke="#34d399" marker-end="url(#arrow-emerald)" />
    <rect x="815" y="719" width="50" height="20" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="840" y="733" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">1 : N</text>

    <!-- 12. comments self reference (1:N replies) [Emerald] -->
    <path d="M 720 780 C 770 780, 770 840, 720 840" stroke="#34d399" marker-end="url(#arrow-emerald)" />
    <text x="780" y="815" font-size="11" fill="#34d399" font-weight="600">replies</text>

    <!-- 13. users -> watch_events (0..1:N) [Sky Blue] -->
    <path d="M 100 340 L 100 930 L 460 930" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <rect x="220" y="919" width="65" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="252" y="933" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">0..1 : N</text>

    <!-- 14. videos -> watch_events (1:N) [Sky Blue] -->
    <path d="M 980 370 L 980 930 L 730 930" stroke="#38bdf8" marker-end="url(#arrow-blue)" />
    <rect x="835" y="919" width="50" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="860" y="933" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">1 : N</text>

    <!-- 15. watch_events -> ad_impressions (1:N) [Amber] -->
    <path d="M 730 960 L 890 960" stroke="#fbbf24" marker-end="url(#arrow-amber)" />
    <rect x="785" y="949" width="50" height="20" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="810" y="963" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">1 : N</text>

  </g>

  <!-- ================= ENTITY CARDS ================= -->

  <!-- 1. USERS -->
  <g transform="translate(80, 100)" filter="url(#card-shadow)">
    <rect width="260" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 260 v 40 h -260 z" fill="#2563eb" rx="10" />
    <rect y="30" width="260" height="10" fill="#2563eb" />
    <text x="130" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">users</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  user_id       <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">UQ  email         <tspan fill="#94a3b8">VARCHAR(255)</tspan></text>
      <text y="48" fill="#e2e8f0">    display_name  <tspan fill="#94a3b8">VARCHAR(100)</tspan></text>
      <text y="72" fill="#e2e8f0">    country_code  <tspan fill="#94a3b8">CHAR(2)</tspan></text>
      <text y="96" fill="#94a3b8">    birth_year    <tspan fill="#64748b">INT (NULL)</tspan></text>
      <text y="120" fill="#94a3b8">    premium_until <tspan fill="#64748b">DATE (NULL)</tspan></text>
      <text y="144" fill="#e2e8f0">    created_at    <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
    </g>
  </g>

  <!-- 2. CHANNELS -->
  <g transform="translate(460, 100)" filter="url(#card-shadow)">
    <rect width="280" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 280 v 40 h -280 z" fill="#0284c7" rx="10" />
    <rect y="30" width="280" height="10" fill="#0284c7" />
    <text x="140" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">channels</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  channel_id     <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">FK  owner_user_id  <tspan fill="#94a3b8">INT</tspan></text>
      <text y="48" fill="#38bdf8" font-weight="bold">UQ  handle         <tspan fill="#94a3b8">VARCHAR(60)</tspan></text>
      <text y="72" fill="#e2e8f0">    channel_name   <tspan fill="#94a3b8">VARCHAR(150)</tspan></text>
      <text y="96" fill="#e2e8f0">    country_code   <tspan fill="#94a3b8">CHAR(2)</tspan></text>
      <text y="120" fill="#e2e8f0">    is_verified    <tspan fill="#94a3b8">BOOLEAN</tspan></text>
      <text y="144" fill="#e2e8f0">    monetization   <tspan fill="#94a3b8">VARCHAR(20)</tspan></text>
      <text y="164" fill="#64748b" font-size="11">    subscriber_count, created_at</text>
    </g>
  </g>

  <!-- 3. VIDEOS -->
  <g transform="translate(860, 90)" filter="url(#card-shadow)">
    <rect width="280" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 280 v 40 h -280 z" fill="#dc2626" rx="10" />
    <rect y="30" width="280" height="10" fill="#dc2626" />
    <text x="140" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">videos</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  video_id        <tspan fill="#94a3b8">CHAR(11)</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">FK  channel_id      <tspan fill="#94a3b8">INT</tspan></text>
      <text y="48" fill="#e2e8f0">    title           <tspan fill="#94a3b8">VARCHAR(255)</tspan></text>
      <text y="72" fill="#94a3b8">    description     <tspan fill="#64748b">TEXT (NULL)</tspan></text>
      <text y="96" fill="#e2e8f0">    category        <tspan fill="#94a3b8">VARCHAR(30)</tspan></text>
      <text y="120" fill="#e2e8f0">    duration_sec    <tspan fill="#94a3b8">INT</tspan></text>
      <text y="144" fill="#e2e8f0">    is_short        <tspan fill="#94a3b8">BOOLEAN</tspan></text>
      <text y="168" fill="#e2e8f0">    is_made_for_kids<tspan fill="#94a3b8">BOOLEAN</tspan></text>
      <text y="192" fill="#e2e8f0">    visibility      <tspan fill="#94a3b8">VARCHAR(20)</tspan></text>
      <text y="212" fill="#64748b" font-size="11">    uploaded_at, published_at, views</text>
    </g>
  </g>

  <!-- 4. PLAYLISTS -->
  <g transform="translate(1260, 100)" filter="url(#card-shadow)">
    <rect width="260" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 260 v 40 h -260 z" fill="#9333ea" rx="10" />
    <rect y="30" width="260" height="10" fill="#9333ea" />
    <text x="130" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">playlists</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  playlist_id   <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">FK  owner_user_id <tspan fill="#94a3b8">INT</tspan></text>
      <text y="48" fill="#e2e8f0">    title         <tspan fill="#94a3b8">VARCHAR(150)</tspan></text>
      <text y="72" fill="#e2e8f0">    visibility    <tspan fill="#94a3b8">VARCHAR(20)</tspan></text>
      <text y="96" fill="#e2e8f0">    created_at    <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
    </g>
  </g>

  <!-- 5. SUBSCRIPTIONS -->
  <g transform="translate(80, 430)" filter="url(#card-shadow)">
    <rect width="240" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 240 v 40 h -240 z" fill="#059669" rx="10" />
    <rect y="30" width="240" height="10" fill="#059669" />
    <text x="120" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">subscriptions</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK,FK  user_id       <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#f59e0b" font-weight="bold">PK,FK  channel_id    <tspan fill="#94a3b8">INT</tspan></text>
      <text y="48" fill="#e2e8f0">       notifications <tspan fill="#94a3b8">VARCHAR(20)</tspan></text>
      <text y="72" fill="#e2e8f0">       subscribed_at <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
    </g>
  </g>

  <!-- 6. PLAYLIST_ITEMS -->
  <g transform="translate(980, 430)" filter="url(#card-shadow)">
    <rect width="260" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 260 v 40 h -260 z" fill="#7e22ce" rx="10" />
    <rect y="30" width="260" height="10" fill="#7e22ce" />
    <text x="130" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">playlist_items</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK,FK  playlist_id <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#f59e0b" font-weight="bold">PK     position    <tspan fill="#94a3b8">INT</tspan></text>
      <text y="48" fill="#38bdf8" font-weight="bold">UQ,FK  video_id    <tspan fill="#94a3b8">CHAR(11)</tspan></text>
      <text y="72" fill="#e2e8f0">       added_at    <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
    </g>
  </g>

  <!-- 7. VIDEO_REACTIONS -->
  <g transform="translate(460, 520)" filter="url(#card-shadow)">
    <rect width="260" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 260 v 40 h -260 z" fill="#d97706" rx="10" />
    <rect y="30" width="260" height="10" fill="#d97706" />
    <text x="130" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">video_reactions</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK,FK  user_id    <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#f59e0b" font-weight="bold">PK,FK  video_id   <tspan fill="#94a3b8">CHAR(11)</tspan></text>
      <text y="48" fill="#e2e8f0">       reaction   <tspan fill="#94a3b8">VARCHAR(10)</tspan></text>
      <text y="72" fill="#e2e8f0">       reacted_at <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
    </g>
  </g>

  <!-- 8. COMMENTS -->
  <g transform="translate(460, 690)" filter="url(#card-shadow)">
    <rect width="260" height="190" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 260 v 40 h -260 z" fill="#15803d" rx="10" />
    <rect y="30" width="260" height="10" fill="#15803d" />
    <text x="130" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">comments</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  comment_id    <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">FK  video_id      <tspan fill="#94a3b8">CHAR(11)</tspan></text>
      <text y="48" fill="#38bdf8" font-weight="bold">FK  user_id       <tspan fill="#94a3b8">INT</tspan></text>
      <text y="72" fill="#34d399" font-weight="bold">FK  parent_comment<tspan fill="#64748b">INT (NULL)</tspan></text>
      <text y="96" fill="#e2e8f0">    body          <tspan fill="#94a3b8">TEXT</tspan></text>
      <text y="120" fill="#64748b" font-size="11">    like_count, is_pinned, created</text>
    </g>
  </g>

  <!-- 9. WATCH_EVENTS -->
  <g transform="translate(460, 900)" filter="url(#card-shadow)">
    <rect width="270" height="190" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 270 v 40 h -270 z" fill="#0284c7" rx="10" />
    <rect y="30" width="270" height="10" fill="#0284c7" />
    <text x="135" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">watch_events</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  watch_id       <tspan fill="#94a3b8">BIGINT</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">FK  user_id        <tspan fill="#64748b">INT (NULL)</tspan></text>
      <text y="48" fill="#38bdf8" font-weight="bold">FK  video_id       <tspan fill="#94a3b8">CHAR(11)</tspan></text>
      <text y="72" fill="#e2e8f0">    started_at     <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
      <text y="96" fill="#e2e8f0">    watch_seconds  <tspan fill="#94a3b8">INT</tspan></text>
      <text y="120" fill="#e2e8f0">    device         <tspan fill="#94a3b8">VARCHAR(20)</tspan></text>
      <text y="136" fill="#64748b" font-size="11">    traffic_source VARCHAR(20)</text>
    </g>
  </g>

  <!-- 10. AD_IMPRESSIONS -->
  <g transform="translate(890, 900)" filter="url(#card-shadow)">
    <rect width="260" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 0 h 260 v 40 h -260 z" fill="#b45309" rx="10" />
    <rect y="30" width="260" height="10" fill="#b45309" />
    <text x="130" y="26" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">ad_impressions</text>
    <g transform="translate(16, 62)" font-size="12" font-family="monospace">
      <text y="0" fill="#f59e0b" font-weight="bold">PK  impression_id <tspan fill="#94a3b8">INT</tspan></text>
      <text y="24" fill="#38bdf8" font-weight="bold">FK  watch_id      <tspan fill="#94a3b8">BIGINT</tspan></text>
      <text y="48" fill="#e2e8f0">    ad_format     <tspan fill="#94a3b8">VARCHAR(20)</tspan></text>
      <text y="72" fill="#e2e8f0">    revenue_inr   <tspan fill="#94a3b8">NUMERIC(8,4)</tspan></text>
      <text y="96" fill="#e2e8f0">    shown_at      <tspan fill="#94a3b8">TIMESTAMPTZ</tspan></text>
    </g>
  </g>

  <!-- LEGEND -->
  <g transform="translate(1260, 430)" filter="url(#card-shadow)">
    <rect width="260" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" fill="#f8fafc" font-weight="bold" font-size="13">Relationship Legend</text>
    <line x1="20" y1="45" x2="240" y2="45" stroke="#334155" />
    <circle cx="30" cy="70" r="5" fill="#38bdf8" />
    <text x="45" y="74" fill="#e2e8f0" font-size="11">Identity &amp; Channel Paths</text>
    <circle cx="30" cy="95" r="5" fill="#34d399" />
    <text x="45" y="99" fill="#e2e8f0" font-size="11">Social &amp; Subscriptions</text>
    <circle cx="30" cy="120" r="5" fill="#c084fc" />
    <text x="45" y="124" fill="#e2e8f0" font-size="11">Playlists &amp; Collections</text>
    <circle cx="30" cy="145" r="5" fill="#fbbf24" />
    <text x="45" y="149" fill="#e2e8f0" font-size="11">Reactions &amp; Engagement</text>
    <circle cx="30" cy="170" r="5" fill="#b45309" />
    <text x="45" y="174" fill="#e2e8f0" font-size="11">Advertising &amp; Revenue</text>
  </g>

</svg>